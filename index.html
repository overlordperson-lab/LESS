<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F7FC">
<title>Сайт переїхав! | Славутський ліцей</title>
<link rel="icon" type="image/jpeg" href="Gemini_Generated_Image_gdkuthgdkuthdku.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F7FC;--grid:#DCE6F3;--ink:#14213D;--soft:#5B6B88;--blue:#2447C8;--green:#16895A;
  --off:#8A96AD;--red:#E0453A;--mark:#FFE98A;--line:#C9D6EA;--card:#ffffffb8;
  --n1:#2f6bff;--n2:#00b878;--n3:#9a5cff;--gl:32%;
}
@media(prefers-color-scheme:dark){
  :root{
    color-scheme:dark;--bg:#0B1428;--grid:#13244A;--ink:#E8EEF9;--soft:#9AAAC7;
    --blue:#7FA8FF;--green:#4ED6A0;--off:#6D7B99;--red:#FF7A6B;--mark:#5A4B12;
    --line:#223764;--card:#14264acc;--n1:#5aa2ff;--n2:#3dffb4;--n3:#c58bff;--gl:75%;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  font-family:Onest,system-ui,sans-serif;color:var(--ink);
  background:linear-gradient(var(--grid) 1px,transparent 1px) 0 0/24px 24px,
             linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/24px 24px,
             var(--bg);
  overflow:hidden;
}

/* Неонові кулі на фоні */
.orb{position:fixed;width:320px;height:320px;border-radius:50%;pointer-events:none;will-change:transform}
.o1{background:var(--n1);left:-140px;top:20vh;animation:orb1 18s ease-in-out infinite alternate}
.o2{background:var(--n3);right:-140px;bottom:20vh;animation:orb2 22s ease-in-out infinite alternate}
@keyframes orb1{to{transform:translate(120px,80px) scale(1.3)}}
@keyframes orb2{to{transform:translate(-110px,-70px) scale(1.25)}}

/* Картка */
.card{
  position:relative;z-index:1;max-width:480px;width:90%;text-align:center;
  background:var(--card);border:1px solid var(--line);border-radius:24px;
  padding:40px 24px;
  box-shadow:0 20px 40px rgba(0,0,0,0.1), 0 0 40px color-mix(in srgb,var(--n1) 10%,transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  animation:popIn 0.8s cubic-bezier(0.2, 0.9, 0.3, 1.2) both;
}
@keyframes popIn{
  from{opacity:0;transform:translateY(30px) scale(0.95)}
}

h1{
  font:700 1.8rem/1.2 Unbounded,Onest,sans-serif;margin-bottom:16px;
  background:linear-gradient(90deg,var(--n1),var(--n2),var(--n3));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  background-size:200% 100%;animation:gshift 4s linear infinite;
}
@keyframes gshift{to{background-position:200% 0}}

p{color:var(--soft);font-size:1.05rem;line-height:1.5;margin-bottom:24px}
p b{color:var(--ink);font-weight:600}

.link-wrapper{
  background:var(--bg);border:1px dashed var(--line);border-radius:12px;
  padding:12px;margin-bottom:24px;word-break:break-all;
  font-family:monospace;font-size:0.9rem;color:var(--soft);
}

/* Кнопка */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  width:100%;padding:16px 20px;border-radius:16px;
  background:var(--ink);color:var(--bg);
  font:600 1.1rem Onest,sans-serif;text-decoration:none;
  border:1px solid var(--ink);cursor:pointer;
  position:relative;overflow:hidden;
  transition:transform 0.2s, box-shadow 0.2s;
  box-shadow:0 8px 24px color-mix(in srgb,var(--n1) 30%,transparent);
  animation:pulseBtn 2s infinite;
}
@keyframes pulseBtn{
  0%, 100% { box-shadow:0 8px 24px color-mix(in srgb,var(--n1) 30%,transparent) }
  50% { box-shadow:0 8px 32px color-mix(in srgb,var(--n1) 60%,transparent) }
}
.btn:hover{transform:translateY(-3px);box-shadow:0 12px 30px color-mix(in srgb,var(--n1) 50%,transparent);animation:none}
.btn::before{
  content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(100deg,transparent,#ffffff55,transparent);
  transform:skewX(-20deg);transition:left 0.6s;
}
.btn:hover::before{left:130%}

/* Таймер переходу */
.timer{
  margin-top:20px;font-size:0.85rem;color:var(--soft);
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.spinner{
  width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--n1);
  border-radius:50%;animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.icon{
  font-size:2.5rem;margin-bottom:16px;display:inline-block;
  animation:float 3s ease-in-out infinite;
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

@media (max-width:380px){h1{font-size:1.5rem}}
</style>
</head>
<body>

<div class="orb o1"></div>
<div class="orb o2"></div>

<div class="card">
  <div class="icon">🚀</div>
  <h1>Ми переїхали!</h1>
  <p>
    Сайт <b>«Славутський ліцей: мій день»</b> перенесено на новий, швидший та надійніший хостинг.
  </p>
  <div class="link-wrapper">
    https://less.overlordperson.workers.dev
  </div>
  
  <a href="https://less.overlordperson.workers.dev" class="btn">
    Перейти на новий сайт →
  </a>

  <div class="timer">
    <div class="spinner"></div>
    <span>Автоматичний перехід через <b id="cd">5</b> сек.</span>
  </div>
</div>

<script>
  // Автоматичний перехід через 5 секунд
  let count = 5;
  const cdEl = document.getElementById('cd');
  
  const interval = setInterval(() => {
    count--;
    if (cdEl) cdEl.textContent = count;
    
    if (count <= 0) {
      clearInterval(interval);
      window.location.href = "https://less.overlordperson.workers.dev";
    }
  }, 1000);
</script>

</body>
</html>
